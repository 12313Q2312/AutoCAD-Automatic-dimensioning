name: Local file safety regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only Python dependencies
        run: python -m pip install "flask>=3.0,<5" "httpx>=0.28,<1" "Pillow>=10,<13" "requests>=2.32,<3"
      - name: Python syntax check
        run: python -m compileall -q app.py file_safety.py tests
      - name: Run Flask file safety tests without AutoCAD
        run: python -m unittest discover -s tests -p "test_file_safety.py" -v
