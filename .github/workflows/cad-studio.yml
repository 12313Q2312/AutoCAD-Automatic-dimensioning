name: CAD Studio offline modeling checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-studio:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies (no AutoCAD)
        run: python -m pip install "flask>=3.0,<5" "httpx>=0.28,<1" "Pillow>=10,<13" "requests>=2.32,<3"
      - name: Check Python syntax
        run: python -m compileall -q app.py solidworks_engine tests
      - name: Check frontend JS syntax
        run: node --check static/studio.js
      - name: Run offline engine and Flask route tests
        run: python -m unittest discover -s tests -p "test_studio_*.py" -v
